<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="tribal" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Ocean wave pattern inspired by Hawaiian tattoo art -->
      <path d="M0 50 Q12.5 35 25 50 T50 50 T75 50 T100 50" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.15"/>
      <path d="M0 70 Q12.5 55 25 70 T50 70 T75 70 T100 70" fill="none" stroke="currentColor" stroke-width="1" opacity="0.1"/>
      <!-- Triangle teeth pattern (niho mano - shark teeth) -->
      <path d="M0 0 L10 15 L20 0" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.12"/>
      <path d="M20 0 L30 15 L40 0" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.12"/>
      <path d="M40 0 L50 15 L60 0" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.12"/>
      <path d="M60 0 L70 15 L80 0" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.12"/>
      <path d="M80 0 L90 15 L100 0" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.12"/>
      <!-- Spearhead pattern (ihe) -->
      <path d="M50 85 L42 100 L50 95 L58 100 Z" fill="currentColor" opacity="0.06"/>
      <path d="M0 85 L-8 100 L0 95 L8 100 Z" fill="currentColor" opacity="0.06"/>
      <path d="M100 85 L92 100 L100 95 L108 100 Z" fill="currentColor" opacity="0.06"/>
      <!-- Enata pattern (people/figures) simplified -->
      <circle cx="25" cy="40" r="2" fill="currentColor" opacity="0.08"/>
      <path d="M25 42 L25 48 M22 44 L28 44 M23 50 L25 48 L27 50" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.08"/>
      <circle cx="75" cy="40" r="2" fill="currentColor" opacity="0.08"/>
      <path d="M75 42 L75 48 M72 44 L78 44 M73 50 L75 48 L77 50" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#tribal)"/>
</svg>
